[project]
name = "harvesters_pg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "genicam>=1.4.0",
    "h5py>=3.12.1",
    "harvesters>=1.4.3",
    "opencv-python>=4.10.0.84",
    "pyqt6>=6.7.1",
    "pyqtgraph>=0.13.7",
    "tqdm>=4.67.1",
]

[build.system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ui", "MainWindow", "cam", "acquire", "VideoThread", "liveview", "settings", "importexport", "frametime", "saving", "reset", "get_attributes", "attributes", "harvester_test"]

[project.scripts]
harvesters_pg = "ui:main"
